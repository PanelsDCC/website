<svg xmlns="http://www.w3.org/2000/svg" width="150" height="220" viewBox="0 0 150 220">
    <!-- Signal Post -->
    <rect x="90" y="20" width="20" height="200" fill="white" />

    <!-- Arm Group (Flipped, adjusted to post) -->
    <g transform="translate(210, 5) scale(-1, 1)">
        <!-- Black Base -->
        <path d="M 105,35 L 80,35 C 65,40 72,80 92,80 Q 105,80 105,70 Z" fill="#000" />

        <!-- Red Circle (Top Circle, Danger) -->
        <circle cx="85" cy="50" r="10" fill="#F02" />

        <!-- Green Circle (Bottom Circle, Clear) -->
        <circle cx="92" cy="68" r="10" fill="#444" />

        <!-- Home Signal Arm (Red) -->
        <rect x="105" y="35" width="95" height="30" fill="#F02" stroke="#000" stroke-width="1" />

        <!-- White Circle with Black Stroke -->
        <circle cx="110" cy="50" r="5" fill="#FFF" stroke="#000" stroke-width="1" />

        <!-- White Rectangle at the End of the Arm -->
        <rect x="160" y="35" width="20" height="30" fill="#FFF" />
    </g>
</svg>
